# Dependabot version updates
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: `package-ecosystem` is REQUIRED and must be one of Dependabot's
# supported identifiers (npm, github-actions, pip, docker, cargo, ...).
# Leaving the GitHub UI placeholder `""` makes Dependabot reject the whole
# file with:
#   The property '#/updates/0/package-ecosystem' value "" did not match ...
#
# This repository has exactly two dependency ecosystems to track:
#   1. npm            -> /package.json + /package-lock.json
#   2. github-actions -> /.github/workflows/*.yml

version: 2
updates:
  # ---------------------------------------------------------------------------
  # 1) npm dependencies (root manifest)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # Bound the PR backlog (Dependabot's default is 5).
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Custom labels must already exist in the repository, otherwise Dependabot
    # silently drops them. `dependencies` and `javascript` both exist here.
    labels:
      - "dependencies"
      - "javascript"
    # Collapse routine, non-breaking bumps into two PRs instead of one PR per
    # package. Major versions intentionally stay ungrouped so each breaking
    # change is reviewed on its own.
    groups:
      runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Opt a package out of automatic PRs when a bump needs a manual migration
    # first, e.g.:
    # ignore:
    #   - dependency-name: "vite"
    #     update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # 2) GitHub Actions (CI workflow files)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
