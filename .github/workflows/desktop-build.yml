name: Desktop Build

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'electron-builder.yml'
      - 'resources/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds by default. See docs/SIGNING.md to enable signing later.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      - name: Run Electron E2E (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e
      - name: Generate opencode manifest
        run: node scripts/gen-opencode-manifest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        shell: bash
        env:
          BUILDER_ARGS: ${{ matrix.args }}
        run: npx electron-builder $BUILDER_ARGS --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: chatnip-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
