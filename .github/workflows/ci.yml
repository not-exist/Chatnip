name: CI

on:
  push:
    branches: [master]
  # SECURITY: runs on ALL pull requests, including those from forks. GITHUB_TOKEN
  # is read-only (see permissions below), but CI still executes fork-authored code
  # (npm scripts, tests). The repo MUST keep "Require approval for all outside
  # collaborators" enabled: Settings → Actions → General → Fork pull request workflows.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: these jobs only read the repo to install/test/build.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  quality:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:node
      - run: npm run build
      - run: npm run build:electron

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e

  # Aggregate status check. Branch protection (see docs/BRANCH_PROTECTION.md)
  # requires a check named exactly "CI"; this gate keeps that contract stable
  # while the real work stays split across the test/quality jobs above.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, quality, e2e]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "test=${{ needs.test.result }} quality=${{ needs.quality.result }} e2e=${{ needs.e2e.result }}"
            exit 1
          fi
